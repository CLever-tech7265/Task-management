version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - task_db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TaskDbContext: ${DB_CONNECTION}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: TaskManagement
      Jwt__Audience: TaskManagementUsers

  task_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: task_db
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1435:1433"
    volumes:
      - sql_data:/var/opt/mssql

  client:
    build: ./client
    ports:
      - "5174:5174"
    depends_on:
      - server
    environment:
      VITE_API_URL: ${VITE_API_URL}

volumes:
  sql_data: